<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Digital Invitations · Moments by Shanaz</title>
<meta name="description" content="Luxury personalised digital invitations — weddings, birthdays, children's parties, engagements and more. Choose a style or go fully bespoke."/>
<meta name="robots" content="index,follow"/>
<link rel="canonical" href="https://www.momentsbyshanaz.co.uk/invitation.html"/>
<link rel="icon" type="image/png" href="favicon.png"/>
<link rel="apple-touch-icon" href="favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Jost:wght@300;400;500&family=Cinzel:wght@400;600&family=Dancing+Script:wght@500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&family=Josefin+Sans:wght@100;300;400&family=Sacramento&family=Nunito:wght@300;400;700;800&family=Pacifico&family=Great+Vibes&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
(function(){
  var auth = sessionStorage.getItem('mbs_auth_invitation');
  var ts = sessionStorage.getItem('mbs_auth_ts');
  var age = ts ? (Date.now() - parseInt(ts)) / 1000 / 60 : 999;
  if(!auth || age > 120){ window.location.replace('/get-started.html'); }
})();
</script>
<script>
const SHEETS_WEBHOOK = 'https://script.google.com/macros/s/AKfycbwRU7j-KON4EltzXzBsSaU33kzVX-C3iBE8Ppamf-9Ahr3sLlVcNdiiUup0LoqU0v3iMg/exec';
let openPreset = null;

const SUGGESTED_HEADLINES = [
  'Will you marry me?', "It's a Boy! 💙", "It's a Girl! 💗",
  'Our little surprise! 🌈', "Boy or Girl?", 'We\'re going on holiday!',
  'A baby is on the way!', 'We\'re getting married!', 'Happy Birthday!',
  'Happy Christmas!', 'A special surprise awaits...'
];

function headlineIsUserEdited() {
  var val = document.getElementById('headline') ? document.getElementById('headline').value.trim() : '';
  if(!val) return false;
  return !SUGGESTED_HEADLINES.includes(val);
}

function togglePreset(card, id){
  if(event.target.closest('.order-panel')) return;
  const panel = document.getElementById('panel-'+id);
  const isOpen = card.classList.contains('open');
  if(openPreset && openPreset !== card){
    openPreset.classList.remove('open');
    openPreset.querySelector('.order-panel').classList.remove('vis');
  }
  card.classList.toggle('open', !isOpen);
  panel.classList.toggle('vis', !isOpen);
  openPreset = isOpen ? null : card;
  if(!isOpen) setTimeout(()=> card.scrollIntoView({behavior:'smooth', block:'nearest'}), 60);
}

function getFields(form){
  const inputs = [...form.querySelectorAll('input:not([type=radio]):not([type=submit]),textarea')];
  return {
    names:    inputs[0]?.value.trim()||'',
    occasion: inputs[1]?.value.trim()||'',
    date:     inputs[2]?.value.trim()||'',
    venue:    inputs[3]?.value.trim()||'',
    extras:   inputs[4]?.value.trim()||'',
    yourName: inputs[5]?.value.trim()||'',
    email:    inputs[6]?.value.trim()||'',
    etsy:     inputs[7]?.value.trim()||'',
  };
}

function showToast(msg, ok=true){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.style.background = ok ? 'var(--char)' : '#c0392b';
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 4000);
}

function selectTheme(el, val){
  el.closest('.theme-row').querySelectorAll('.theme-swatch').forEach(s=>s.classList.remove('sel'));
  el.classList.add('sel');
  el.closest('.order-panel').dataset.theme = val;
}

async function submitPreset(e, styleName, btn){
  e.stopPropagation();
  const form = btn.closest('.order-panel');
  const f = getFields(form);
  const bgTheme = form.dataset.theme || 'none';

  if(!f.names){ showToast('Please add the name(s) for the invitation.',false); return; }
  if(!f.yourName){ showToast('Please add your name.',false); return; }
  if(!f.email || !f.email.includes('@')){ showToast('Please add a valid email address.',false); return; }

  btn.textContent = 'Sending\u2026'; btn.disabled = true;

  const orderRef = 'MBS-' + Date.now().toString(36).toUpperCase().slice(-6);

  const presetMsg = [
    '=== INVITATION ORDER (PRESET) [' + orderRef + '] ===',
    'Submitted: ' + new Date().toLocaleString('en-GB'),
    '',
    '--- INVITATION DETAILS ---',
    'Style:       ' + styleName,
    'Background:  ' + (bgTheme !== 'none' ? bgTheme : 'preset default'),
    'Names:       ' + f.names,
    'Occasion:    ' + (f.occasion || 'not specified'),
    'Date/Time:   ' + (f.date || 'not specified'),
    'Venue:       ' + (f.venue || 'not specified'),
    'Extras:      ' + (f.extras || 'none'),
    '',
    '--- CUSTOMER ---',
    'Name:        ' + f.yourName,
    'Email:       ' + f.email,
    'Etsy Ref:    ' + (f.etsy || 'none'),
  ].join('\n');

  try {
    await emailjs.send('service_q7cy9mq', 'template_lhsm3kw', {
      subject:   'New Invitation Order [' + orderRef + '] \u2014 ' + styleName + ' for ' + f.names,
      message:   presetMsg,
      from_name: f.yourName,
      from_email: f.email,
      reply_to:  f.email,
      to_email:  'hello@momentsbyshanaz.co.uk',
    });

    await emailjs.send('service_q7cy9mq', 'template_confirm', {
      to_email:    f.email,
      to_name:     f.yourName,
      order_ref:   orderRef,
      order_type:  'Digital Invitation \u2014 ' + styleName,
      price:       '\u00a38',
      etsy_ref:    f.etsy || 'n/a',
      order_summary: [
        'Style:    ' + styleName,
        'Names:    ' + f.names,
        'Occasion: ' + (f.occasion || 'not specified'),
        'Date:     ' + (f.date || 'not specified'),
        'Venue:    ' + (f.venue || 'not specified'),
      ].join('\n'),
    });

    try {
      await fetch(SHEETS_WEBHOOK, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          orderRef:  orderRef,
          name:      f.yourName,
          email:     f.email,
          orderType: 'Digital Invitation \u2014 ' + styleName,
          price:     '\u00a38',
          etsyRef:   f.etsy || '',
          timestamp: new Date().toLocaleString('en-GB'),
        })
      });
    } catch(e){ console.warn('Sheets log failed:', e); }

    showToast('Order sent! Check your email for confirmation \u2736');
    btn.textContent = 'Order sent \u2736';
    form.querySelectorAll('input,textarea').forEach(i=>i.value='');
  } catch(err){
    console.error(err);
    showToast('Something went wrong \u2014 please email hello@momentsbyshanaz.co.uk directly.',false);
    btn.textContent = 'Send My Order to Shanaz \u2736';
    btn.disabled = false;
  }
}

async function submitBespoke(btn){
  const name     = document.getElementById('b-name')?.value.trim()||'';
  const email    = document.getElementById('b-email')?.value.trim()||'';
  const occasion = document.getElementById('b-occasion')?.value.trim()||'';
  const date     = document.getElementById('b-date')?.value.trim()||'';
  const names    = document.getElementById('b-names')?.value.trim()||'';
  const venue    = document.getElementById('b-venue')?.value.trim()||'';
  const vision   = document.getElementById('b-vision')?.value.trim()||'';
  const etsy     = document.getElementById('b-etsy')?.value.trim()||'';

  if(!name){ showToast('Please add your name.',false); return; }
  if(!email||!email.includes('@')){ showToast('Please add a valid email address.',false); return; }
  if(!vision){ showToast('Please describe your vision.',false); return; }

  btn.textContent = 'Sending\u2026'; btn.disabled = true;

  const orderRef = 'MBS-' + Date.now().toString(36).toUpperCase().slice(-6);

  const bespokeMsg = [
    '=== BESPOKE INVITATION ORDER [' + orderRef + '] ===',
    'Submitted: ' + new Date().toLocaleString('en-GB'),
    '',
    '--- INVITATION DETAILS ---',
    'Style:     Bespoke / Custom',
    'Occasion:  ' + (occasion || 'not specified'),
    'Names:     ' + (names || 'not specified'),
    'Date:      ' + (date || 'not specified'),
    'Venue:     ' + (venue || 'not specified'),
    'Vision:    ' + vision,
    '',
    '--- CUSTOMER ---',
    'Name:      ' + name,
    'Email:     ' + email,
    'Etsy Ref:  ' + (etsy || 'none'),
  ].join('\n');

  try {
    await emailjs.send('service_q7cy9mq', 'template_lhsm3kw', {
      subject:   'BESPOKE Invitation [' + orderRef + '] \u2014 ' + (occasion||'custom') + (names ? ' for ' + names : ''),
      message:   bespokeMsg,
      from_name: name,
      from_email: email,
      reply_to:  email,
      to_email:  'hello@momentsbyshanaz.co.uk',
    });

    await emailjs.send('service_q7cy9mq', 'template_confirm', {
      to_email:    email,
      to_name:     name,
      order_ref:   orderRef,
      order_type:  'Bespoke Invitation',
      price:       'from \u00a320',
      etsy_ref:    etsy || 'n/a',
      order_summary: [
        'Type:     Fully Bespoke',
        'Occasion: ' + (occasion || 'not specified'),
        'Names:    ' + (names || 'not specified'),
        'Vision:   ' + vision,
      ].join('\n'),
    });

    try {
      await fetch(SHEETS_WEBHOOK, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          orderRef:  orderRef,
          name:      name,
          email:     email,
          orderType: 'Bespoke Invitation',
          price:     'from \u00a320',
          etsyRef:   etsy || '',
          timestamp: new Date().toLocaleString('en-GB'),
        })
      });
    } catch(e){ console.warn('Sheets log failed:', e); }

    showToast('Vision received! Check your email for confirmation \u2736');
    btn.textContent = 'Order sent \u2736';
    document.querySelectorAll('#bespoke-form input, #bespoke-form textarea').forEach(i=>i.value='');
  } catch(err){
    console.error(err);
    showToast('Something went wrong \u2014 please email hello@momentsbyshanaz.co.uk directly.',false);
    btn.textContent = 'Send My Vision to Shanaz \u2736';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
